site_name: noisyvalue
site_url: https://sbaldasty.github.io/noisyvalue/
repo_url: https://github.com/sbaldasty/noisyvalue
docs_dir: docs

theme:
  name: material

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: .
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_if_no_docstring: false
            show_root_heading: true
            members_order: source

nav:
  - Home: index.md
  - API reference:
      - Core types: api/core.md
      - Sampling: api/sample.md
      - Contingency tables: api/contingency.md
      - Arrays: api/array.md
      - Visualization: api/visual.md
      - Storage: api/io.md
      - Census: api/census.md
      - Wikimedia: api/wikimedia.md
      - OpenDP: api/opendp.md
      - Dataset framework: api/dataset.md
  - Design notes:
      - Dataset framework: dataset-framework.md
      - Wikimedia errata: wikimedia-errata.md
      - True pageviews: wikimedia-true-pageviews.md
